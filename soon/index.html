<style>
:root { --bg: #faf9f5; --ink: #1f1e1d; --muted: #5e5d59; --accent: #c96442; font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #1c1b19; --ink: #ecebe6; --muted: #a8a69e; --accent: #d97757; } }
:root[data-theme="dark"] { --bg: #1c1b19; --ink: #ecebe6; --muted: #a8a69e; --accent: #d97757; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink); padding: 32px 16px; text-align: center; }
h1 { font-size: clamp(32px, 7vw, 48px); margin: 20px 0 10px; letter-spacing: -0.02em; }
p { color: var(--muted); font-size: clamp(17px, 2.6vw, 20px); max-width: 560px; margin: 0 auto 10px; line-height: 1.55; }
a { color: var(--accent); }
.soon { display: inline-block; margin-top: 18px; font-size: 14px; color: var(--accent); border: 1px solid currentColor; border-radius: 999px; padding: 3px 12px; }
</style>
